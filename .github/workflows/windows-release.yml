name: Windows Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # Needed to upload release assets
  id-token: write # Needed for build provenance attestation
  attestations: write # Needed for build provenance attestation

jobs:
  cmake:
    name: cmake + ${{ matrix.msvc }} + ${{ matrix.arch }} + ${{ matrix.shard }}
    runs-on:
      group: cpp-runners
      labels: ${{ endsWith(matrix.msvc, '-2019') && 'windows-2019' || 'windows-2022' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        msvc: [ msvc-2022 ]
        arch: [ x64, x86 ]
        shard: [ BqDriver ]
    env:
      DRIVER_ARCH: ${{ matrix.arch }}
      BUILD_SHARD: ${{ matrix.shard }}
      VCPKG_TRIPLET: ${{ matrix.arch }}-windows
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ inputs.checkout-ref }}
        persist-credentials: false
    - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        create_credentials_file: true
        credentials_json: ${{ secrets.BUILD_CACHE_KEY }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      id: py311
      with:
        python-version: '3.11'
    - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      env:
        CLOUDSDK_PYTHON: ${{ steps.py311.outputs.python-path }}
    # We are deliberately downgrading cmake here because v3.31.0 runs each integration test twice
    - name: Install CMake
      uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0
      with:
        cmakeVersion: "3.29.0"
    - name: Dynamic Configuration
      id: dynamic
      shell: bash
      run: |
        echo "vcpkg-version=$(cat ci/etc/vcpkg-version.txt)" >> "${GITHUB_OUTPUT}"
        echo "VCPKG_BINARY_SOURCES=clear;files,${{ runner.temp }}/vcpkg-cache,readwrite" >> "${GITHUB_ENV}"


    - name: Ensure .NET Framework 4.5 or higher is installed
      shell: powershell
      run: |
        Write-Output "Checking for .NET Framework 4.5 or higher..."
        $key = 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full'
        $release = (Get-ItemProperty -Path $key -Name Release -ErrorAction SilentlyContinue).Release
        if ($release -ge 378389) {
            Write-Output ".NET Framework 4.5 or higher is already installed (Release version: $release)."
        }
        else {
            Write-Output "Installing .NET Framework 4.8..."
            choco install netfx-4.8 -y
        }

    - name: Install WiX Toolset 3.11
      run: |
        choco install wixtoolset -y

    - name: Download and Install vcpkg
      shell: bash
      env:
        VCPKG_VERSION: ${{ steps.dynamic.outputs.vcpkg-version }}
      run: |
        cd "${TEMP}"
        mkdir .build
        cd .build
        git clone --branch "$VCPKG_VERSION" https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
    - name: Restore cached vcpkg binaries
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: vcpkg-cache-${{ matrix.msvc }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'ci/etc/vcpkg-version.txt') }}
        restore-keys: |
          vcpkg-cache-${{ matrix.msvc }}-${{ matrix.arch }}-
    # go/github-actions#gha-bestpractices explains why we use a SHA instead of
    # a named version for this runner. We could avoid using this runner with the
    # ideas from:
    #   https://github.com/microsoft/vswhere/wiki/Find-VC
    # Note that in other runners the publisher is GitHub. If we trust GitHub
    # to run the VM, we should trust their runners.
    - uses: ilammy/msvc-dev-cmd@cec98b9d092141f74527d0afa6feb2af698cfe89 # v1.12.1
      with:
        arch: ${{ matrix.arch }}
    - name: Read driver version from github tag
      id: version
      shell: bash
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        echo "Tag version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Build cpp-bigquery-odbc
      shell: bash
      env:
        CLOUDSDK_PYTHON: ${{ steps.py311.outputs.python-path }}
        DRIVER_VERSION: ${{ steps.version.outputs.version }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        export VCPKG_ROOT="${TEMP}/.build/vcpkg"
        export CMAKE_OUT="c:/b"



        export MSVC_VERSION="${{ matrix.msvc }}"
        export BRANCH_IDENTIFIER=$(echo "$BRANCH_NAME" | tr '[:punct:]' '_')
        export CPP_BIGQUERY_ODBC_TEST_TABLE_PREFIX="windows_${BRANCH_IDENTIFIER}_${MSVC_VERSION//[-:;.,?\/]/_}_${DRIVER_ARCH}_$BUILD_SHARD"

        # choose correct triplet for architecture
        if [ "$DRIVER_ARCH" == "x86" ]; then
          export VCPKG_TRIPLET="x86-windows-static"
          sed -i '/"arrow",/d' vcpkg.json
        else
          export VCPKG_TRIPLET="x64-windows-static"
        fi

        echo "Using VCPKG_TRIPLET=${VCPKG_TRIPLET}"
        version=$DRIVER_VERSION
        echo "Building version: $version"
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DCMAKE_CXX_STANDARD=17 \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="Release" \
          -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="Release" \
          -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="Release" \
          -DVCPKG_TARGET_TRIPLET="${VCPKG_TRIPLET}" \
          -DODBC_EXAMPLES=OFF \
          -DODBC_UNIT_TESTING=OFF \
          -DODBC_INTEGRATION_TESTING=ON \
          -DCLIENT_LIBRARY_INTEGRATION_TESTING=OFF \
          -DBQ_DRIVER_INTEGRATION_TESTS=ON \
          -DPROJECT_VERSION="${version}"
        cmake --build build --config Release --parallel 16

    - name: Copy built DLLs to installer directory
      shell: bash
      run: |
        echo "Starting copy process..."
        SOURCE_DIR="build/google/cloud/odbc/Release"
        DEST_DIR="ci/installer/files/${DRIVER_ARCH}/Release"
        FILES=("google_cloud_odbc_bq_driver.dll")

        echo "SOURCE_DIR=$SOURCE_DIR"
        echo "DEST_DIR=$DEST_DIR"
        mkdir -p "$DEST_DIR"

        for f in "${FILES[@]}"; do
          if [ -f "$SOURCE_DIR/$f" ]; then
            cp -v "$SOURCE_DIR/$f" "$DEST_DIR/"
            if [ $? -eq 0 ]; then
              echo "Copied $f successfully."
            else
              echo "Failed to copy $f."
            fi
          else
            echo "$f not found in source directory: $SOURCE_DIR"
          fi
        done

        echo "Copy process completed."

    - name: Run Upgrade Code for driver version
      shell: pwsh
      env:
        DRIVER_VERSION: ${{ steps.version.outputs.version }}
      run: |
        $version = "$env:DRIVER_VERSION"
        $wix_version = "$version"

        Write-Output "Using version: $wix_version"

        # Export environment variables for later steps
        echo "VERSION=$version" >> $env:GITHUB_ENV
        echo "WIX_VERSION=$wix_version" >> $env:GITHUB_ENV

        # Copy roots.pem file 
        $roots_path = "ci/installer/ODBCDriverForBigQuery/Assets/roots.pem"
        Write-Output "Updating roots.pem at $roots_path"
        Copy-Item -Path ci/etc/roots.pem -Destination $roots_path -Force
        if ($LASTEXITCODE -eq 0) {
        Write-Output "roots.pem Copy successfully."
        } else {
            Write-Output "Failed to Copy roots.pem."
        }

        # Run the PowerShell upgrade script
        Write-Output "Running upgrade_code.ps1 with version $wix_version"
        ./ci/installer/ODBCDriverForBigQuery/upgrade_code.ps1 -new_version "$wix_version"

    - name: Build Windows Installer (WiX)
      run: |
        Write-Output "Locating MSBuild..."
        $msbuildPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
        Write-Output "MSBuild found at: $msbuildPath"

        Write-Output "Building installer with MSBuild..."
        & $msbuildPath ci\installer\ODBCDriverForBigQuery\ODBCDriverForBigQuery.wixproj /p:Configuration=Release /p:Platform=$env:DRIVER_ARCH

    - name: Rename MSI
      shell: bash
      env:
        DRIVER_VERSION: ${{ steps.version.outputs.version }}
      run: |
        MSI_DIR="ci/installer/ODBCDriverForBigQuery/bin/Release/en-us"
        for f in "$MSI_DIR"/*.msi; do
          mv "$f" "$MSI_DIR/ODBCDriverforBigQuery_windows_${DRIVER_ARCH}_${DRIVER_VERSION}.msi"
        done

    - name: Download and Install the ODBC Driver
      shell: powershell
      env:
        DRIVER_VERSION: ${{ steps.version.outputs.version }}
      run: |
        $msiPath = "ci/installer/ODBCDriverForBigQuery/bin/Release/en-us/ODBCDriverforBigQuery_windows_$($env:DRIVER_ARCH)_$($env:DRIVER_VERSION).msi"
        .\ci\gha\builds\lib\odbc-driver-install.ps1 -LocalMsiPath $msiPath

    - name: Run DSN Creation Script
      shell: powershell
      run: |
        Write-Output "Downloading service account key from Secret Manager..."
        $keyPath = "service_account_auth_keys.json"
        gcloud secrets versions access latest --secret=service-account-auth-keys --out-file="$keyPath"
        $absoluteKeyPath = (Resolve-Path -Path "$keyPath").Path
        Write-Output "Downloaded service account key to: $absoluteKeyPath"

        if (-not (Test-Path -Path "C:\b" -PathType Container)) {
            New-Item -Path "C:\b" -ItemType Directory -Force
        }
        Copy-Item -Path $absoluteKeyPath -Destination "C:\b\service_account_auth_keys.json"

        $arch = if ($env:DRIVER_ARCH -eq 'x64') { '64' } else { '32' }
        $regFilePath = Join-Path $PWD.Path "ci\gha\builds\lib\system_dsn_setup_$arch.reg"
        Write-Output "Running DSN creation script from $regFilePath ..."
        reg import $regFilePath
        Write-Output "DSN creation completed."

    - name: Running testcases
      shell: bash
      env:
        CLOUDSDK_PYTHON: ${{ steps.py311.outputs.python-path }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        export VCPKG_ROOT="${TEMP}/.build/vcpkg"
        export MSVC_VERSION="${{ matrix.msvc }}"
        export BRANCH_IDENTIFIER=$(echo "$BRANCH_NAME" | tr '[:punct:]' '_')
        export CPP_BIGQUERY_ODBC_TEST_TABLE_PREFIX="windows_${BRANCH_IDENTIFIER}_${MSVC_VERSION//[-:;.,?\/]/_}_${DRIVER_ARCH}_$BUILD_SHARD"

        export GOOGLE_APPLICATION_CREDENTIALS="$GOOGLE_GHA_CREDS_PATH"
        export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$GOOGLE_GHA_CREDS_PATH"

        gcloud secrets versions access latest --secret=external-account-auth-keys --out-file="c:/b/external_account_auth_keys.json"
        gcloud secrets versions access latest --secret=external-auth-token-script --out-file="c:/b/external_auth_token_raw.sh"

        sed 's/print-access-token/print-access-token | tr -d "\\r"/g' c:/b/external_auth_token_raw.sh > c:/b/external_auth_token_patched.sh
        tr -d '\r' < c:/b/external_auth_token_patched.sh > c:/b/external_auth_token.sh
        chmod +x c:/b/external_auth_token.sh
        c:/b/external_auth_token.sh c:/b/tkn.txt
        if [ ! -s "c:/b/tkn.txt" ]; then
          echo "Error: c:/b/tkn.txt is empty or does not exist!" >&2
          exit 1
        fi

        jq '.credential_source.file = "c:\\b\\tkn.txt"' c:/b/external_account_auth_keys.json > c:/b/external_account_auth_keys_final.json
        export CPP_BIGQUERY_ODBC_TEST_EXTERNAL_ACCOUNT_AUTH_KEY="c:\\b\\external_account_auth_keys_final.json"
        export CPP_BIGQUERY_ODBC_TEST_SERVICE_ACCOUNT_AUTH_KEY="C:\\b\\service_account_auth_keys.json"
        export GOOGLE_APPLICATION_CREDENTIALS="C:\\b\\service_account_auth_keys.json"

        if [ "$BUILD_SHARD" == "Core" ]; then
          export ODBC_TESTS_DSN="SampleDSN"
          export ODBC_TRANSACTIONS_TESTS_DSN="ODBCTransactionsTestsDSN"
        else
          export ODBC_TESTS_DSN="BigQuery DSN"
          export ODBC_TRANSACTIONS_TESTS_DSN="ODBCGoogleTransactionsTestsDSN"
        fi
        cd build
        ctest --output-on-failure --parallel 16

    - name: Attest build provenance
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
      with:
        subject-path: ci/installer/ODBCDriverForBigQuery/bin/Release/en-us/ODBCDriverforBigQuery_windows_${{ matrix.arch }}_${{ steps.version.outputs.version }}.msi

    - name: Release Driver
      shell: bash
      env:
        DRIVER_VERSION: ${{ steps.version.outputs.version }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        gh release create "$BRANCH_NAME" --title "ODBC Driver for BigQuery" --notes "Release build for $BRANCH_NAME" || true
        gh release upload "$BRANCH_NAME" ci/installer/ODBCDriverForBigQuery/bin/Release/en-us/*_${DRIVER_ARCH}_${DRIVER_VERSION}.msi --clobber

    - name: Upload MSI to GCS
      shell: pwsh
      env:
        GCS_BUCKET: bq-dev-tools-testing-drivers
        DRIVER_VERSION: ${{ steps.version.outputs.version }}
      run: |
        # Map x64->64 and x86->32
        $arch = if ($env:DRIVER_ARCH -eq 'x64') { '64' } else { '32' }

        $MSI_DIR = "ci/installer/ODBCDriverForBigQuery/bin/Release/en-us"
        $MSI_FILE = "ODBCDriverforBigQuery_windows_$($env:DRIVER_ARCH)_$($env:DRIVER_VERSION).msi"

        Write-Output "Uploading $MSI_FILE to gs://$env:GCS_BUCKET/odbc-windows/$arch/ ..."
        gsutil -m cp `
          "$MSI_DIR/$MSI_FILE" `
          "gs://$env:GCS_BUCKET/odbc-windows/$arch/$MSI_FILE"
