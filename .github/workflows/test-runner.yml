name: "gha: macOS & Windows"

on:
  # Only trigger on actual pushes to these branches.
  # A PR merge counts as a push to the target branch.
  push:
    branches: [ 'main', 'ci-gha**' ]
  # Only users with write access can trigger this
  workflow_dispatch:
      inputs:
        run_macos:
          description: 'Run macOS tests'
          type: boolean
          default: true
        run_windows:
          description: 'Run Windows tests'
          type: boolean
          default: true
        run_benchmark_bq:
          description: 'Run Benchmark: Google Driver'
          type: boolean
          default: false
        run_benchmark_existing:
          description: 'Run Benchmark: Existing Driver'
          type: boolean
          default: false
        generate_benchmark_results:
          description: 'Generate Benchmark Results Table'
          type: boolean
          default: false

# Concurrency configuration:
# 1. Automated runs (push events) share the same group, so new commits cancel older in-progress runs.
# 2. Manual dispatches (workflow_dispatch) use a unique group name containing github.run_id.
#    This isolates manual runs from each other, allowing multiple manual dispatches
#    (e.g., Run Windows tests vs Run Benchmark) to execute in parallel without blocking or cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-flight:
    # Manual runs (workflow_dispatch) are treated as internal/trusted
    environment: >-
      ${{
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'internal' ||
          (contains(fromJSON(vars.TRUSTED_FORKS), github.actor) && 'internal') ||
          'external'
      }}
    name: Require Approval for External PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checkout-sha: ${{ steps.save-sha.outputs.sha }}
    steps:
      - name: Save SHA
        id: save-sha
        # github.sha will point to the head of the branch selected in the manual dropdown
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

  # Run other jobs once the `pre-flight` job passes. When the `pre-flight`
  # job requires approval, these blocks all the other jobs. The jobs are defined
  # in separate files to keep the size of this file under control. Note how
  # the additional jobs inherit any secrets needed to use the remote caches and
  # receive what version to checkout as an input.
  macos-cmake:
    name: macOS-CMake
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Logic: Run if it's a push OR if the manual checkbox was checked
    if: |
      github.event_name == 'push' || inputs.run_macos == true
    needs: [pre-flight]
    uses: ./.github/workflows/macos-cmake.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
  windows-cmake:
    name: Windows-CMake
    if: |
      github.event_name == 'push' || inputs.run_windows == true
    needs: [pre-flight]
    uses: ./.github/workflows/windows-cmake.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}

  windows-benchmark-bq:
    name: Windows-Benchmark (Google Driver)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-benchmark-bq
      cancel-in-progress: true
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_benchmark_bq == true
    needs: [pre-flight]
    uses: ./.github/workflows/windows-benchmark.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
      build_shard: 'BqDriver'
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}

  windows-benchmark-existing:
    name: Windows-Benchmark (Existing Driver)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-benchmark-existing
      cancel-in-progress: true
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_benchmark_existing == true
    needs: [pre-flight]
    uses: ./.github/workflows/windows-benchmark.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
      build_shard: 'Core'
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}

  windows-benchmark-results:
    name: Windows-Benchmark (Generate Results Table)
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.run_benchmark_bq == true || inputs.run_benchmark_existing == true || inputs.generate_benchmark_results == true)
    needs: [pre-flight, windows-benchmark-bq, windows-benchmark-existing]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.pre-flight.outputs.checkout-sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          create_credentials_file: true
          credentials_json: ${{ secrets.BUILD_CACHE_KEY }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Download Results from GCS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p benchmark_results

          gcloud storage cp gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/performance_benchmark_results_BqDriver.txt ./benchmark_results/current_bq.txt || true

          gcloud storage cp gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/performance_benchmark_results_Core.txt ./benchmark_results/current_core.txt || true

          gcloud storage cp gs://bq-dev-tools-testing-drivers/odbc-perf/main/results/performance_benchmark_results_BqDriver.txt ./benchmark_results/main_bq.txt || true

      - name: Parse Results and Generate Table
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ needs.pre-flight.outputs.checkout-sha }}
        run: |
          python3 ci/cloudbuild/builds/lib/benchmark_results.py \
            --existing ./benchmark_results/current_core.txt \
            --current ./benchmark_results/current_bq.txt \
            --main ./benchmark_results/main_bq.txt \
            --branch-name "${BRANCH_NAME}" \
            --commit-sha "${COMMIT_SHA}" \
            --output benchmark_summary_table.txt

      - name: Upload Table to GCS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          gcloud storage cp benchmark_summary_table.txt gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/
          echo "Uploaded benchmark table to gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/benchmark_summary_table.txt"
