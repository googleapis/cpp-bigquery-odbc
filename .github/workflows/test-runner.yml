name: "gha: macOS & Windows"

on:
  # Only trigger on actual pushes to these branches.
  # A PR merge counts as a push to the target branch.
  push:
    branches: [ 'main', 'ci-gha**' ]
  # Only users with write access can trigger this
  workflow_dispatch:
      inputs:
        run_macos:
          description: 'Run macOS tests'
          type: boolean
          default: true
        run_windows:
          description: 'Run Windows tests'
          type: boolean
          default: true
        run_benchmark_bq:
          description: 'Run Benchmark: Google Driver'
          type: boolean
          default: false
        run_benchmark_existing:
          description: 'Run Benchmark: Existing Driver'
          type: boolean
          default: false

# Concurrency configuration:
# 1. Automated runs (push events) share the same group, so new commits cancel older in-progress runs.
# 2. Manual dispatches (workflow_dispatch) use a unique group name containing github.run_id.
#    This isolates manual runs from each other, allowing multiple manual dispatches
#    (e.g., Run Windows tests vs Run Benchmark) to execute in parallel without blocking or cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  pre-flight:
    # Manual runs (workflow_dispatch) are treated as internal/trusted
    environment: >-
      ${{
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'internal' ||
          (contains(fromJSON(vars.TRUSTED_FORKS), github.actor) && 'internal') ||
          'external'
      }}
    name: Require Approval for External PRs
    runs-on: ubuntu-latest
    outputs:
      checkout-sha: ${{ steps.save-sha.outputs.sha }}
    steps:
      - name: Save SHA
        id: save-sha
        # github.sha will point to the head of the branch selected in the manual dropdown
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

  # Run other jobs once the `pre-flight` job passes. When the `pre-flight`
  # job requires approval, these blocks all the other jobs. The jobs are defined
  # in separate files to keep the size of this file under control. Note how
  # the additional jobs inherit any secrets needed to use the remote caches and
  # receive what version to checkout as an input.
  macos-cmake:
    name: macOS-CMake
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Logic: Run if it's a push OR if the manual checkbox was checked
    if: |
      github.event_name == 'push' || inputs.run_macos == true
    needs: [pre-flight]
    uses: ./.github/workflows/macos-cmake.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
    secrets: inherit
  windows-cmake:
    name: Windows-CMake
    if: |
      github.event_name == 'push' || inputs.run_windows == true
    needs: [pre-flight]
    uses: ./.github/workflows/windows-cmake.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
    secrets: inherit

  windows-benchmark-bq:
    name: Windows-Benchmark (Google Driver)
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_benchmark_bq == true &&
      (needs.windows-cmake.result == 'success' || needs.windows-cmake.result == 'skipped')
    needs: [pre-flight, windows-cmake]
    uses: ./.github/workflows/windows-benchmark.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
      build_shard: 'BqDriver'
    secrets: inherit

  windows-benchmark-existing:
    name: Windows-Benchmark (Existing Driver)
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_benchmark_existing == true &&
      (needs.windows-cmake.result == 'success' || needs.windows-cmake.result == 'skipped')
    needs: [pre-flight, windows-cmake]
    uses: ./.github/workflows/windows-benchmark.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
      build_shard: 'Core'
    secrets: inherit
