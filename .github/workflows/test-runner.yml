name: "gha: macOS & Windows"

on:
  # Only trigger on actual pushes to these branches.
  # A PR merge counts as a push to the target branch.
  push:
    branches: [ 'main', 'ci-gha**' ]
  # Only users with write access can trigger this
  workflow_dispatch:
      inputs:
        run_macos:
          description: 'Run macOS tests'
          type: boolean
          default: true
        run_windows:
          description: 'Run Windows tests'
          type: boolean
          default: true
        run_benchmark_bq:
          description: 'Run Benchmark: Google Driver'
          type: boolean
          default: false
        run_benchmark_existing:
          description: 'Run Benchmark: Existing Driver'
          type: boolean
          default: false
        generate_benchmark_results:
          description: 'Generate Benchmark Results Table'
          type: boolean
          default: false

# Concurrency configuration:
# 1. Automated runs (push events) share the same group, so new commits cancel older in-progress runs.
# 2. Manual dispatches (workflow_dispatch) use a unique group name containing github.run_id.
#    This isolates manual runs from each other, allowing multiple manual dispatches
#    (e.g., Run Windows tests vs Run Benchmark) to execute in parallel without blocking or cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-flight:
    # Manual runs (workflow_dispatch) are treated as internal/trusted
    environment: >-
      ${{
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'internal' ||
          (contains(fromJSON(vars.TRUSTED_FORKS), github.actor) && 'internal') ||
          'external'
      }}
    name: Require Approval for External PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      checkout-sha: ${{ steps.save-sha.outputs.sha }}
    steps:
      - name: Save SHA
        id: save-sha
        # github.sha will point to the head of the branch selected in the manual dropdown
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

  # Run other jobs once the `pre-flight` job passes. When the `pre-flight`
  # job requires approval, these blocks all the other jobs. The jobs are defined
  # in separate files to keep the size of this file under control. Note how
  # the additional jobs inherit any secrets needed to use the remote caches and
  # receive what version to checkout as an input.
  macos-cmake:
    name: macOS-CMake
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Logic: Run if it's a push OR if the manual checkbox was checked
    if: |
      github.event_name == 'push' || inputs.run_macos == true
    needs: [pre-flight]
    uses: ./.github/workflows/macos-cmake.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}
  windows-cmake:
    name: Windows-CMake
    if: |
      github.event_name == 'push' || inputs.run_windows == true
    needs: [pre-flight]
    uses: ./.github/workflows/windows-cmake.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}

  windows-benchmark-bq:
    name: Windows-Benchmark (Google Driver)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-benchmark-bq
      cancel-in-progress: true
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_benchmark_bq == true
    needs: [pre-flight]
    uses: ./.github/workflows/windows-benchmark.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
      build_shard: 'BqDriver'
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}

  windows-benchmark-existing:
    name: Windows-Benchmark (Existing Driver)
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-benchmark-existing
      cancel-in-progress: true
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_benchmark_existing == true
    needs: [pre-flight]
    uses: ./.github/workflows/windows-benchmark.yml
    with:
      checkout-ref: ${{ needs.pre-flight.outputs.checkout-sha }}
      build_shard: 'Core'
    secrets:
      BUILD_CACHE_KEY: ${{ secrets.BUILD_CACHE_KEY }}

  windows-benchmark-results:
    name: Windows-Benchmark (Generate Results Table)
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.run_benchmark_bq == true || inputs.run_benchmark_existing == true || inputs.generate_benchmark_results == true)
    needs: [pre-flight, windows-benchmark-bq, windows-benchmark-existing]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.pre-flight.outputs.checkout-sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          create_credentials_file: true
          credentials_json: ${{ secrets.BUILD_CACHE_KEY }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Download Results from GCS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p benchmark_results

          gcloud storage cp gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/performance_benchmark_results_BqDriver.txt ./benchmark_results/current_bq.txt || true

          gcloud storage cp gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/performance_benchmark_results_Core.txt ./benchmark_results/current_core.txt || true

          gcloud storage cp gs://bq-dev-tools-testing-drivers/odbc-perf/main/results/performance_benchmark_results_BqDriver.txt ./benchmark_results/main_bq.txt || true

      - name: Parse Results and Generate Table
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'EOF'
          import os
          import re

          branch_name = os.environ.get('BRANCH_NAME', 'Current')

          def clean_test_name(name):
              # GTest names follow [Instantiation/]TestSuite.TestCase[/Param]
              # Extract everything after '.' to generically remove TestSuite/Instantiation prefix
              if '.' in name:
                  name = name.split('.', 1)[1]
              # Strip legacy parameter suffix if comparing against older baselines
              name = re.sub(r'/(?:With|Without)HTAPI$', '', name)
              return name

          def parse_gtest_output(filepath):
              # The suite is run several times across iterations, so each test
              # appears once per repetition. Take the median of its timings.
              samples = {}
              if not os.path.exists(filepath):
                  return {}

              pattern = re.compile(r'\[\s+OK\s+\]\s+(\S+)\s+\(([^)]+)\)')
              try:
                  with open(filepath, 'r') as f:
                      for line in f:
                          match = pattern.search(line)
                          if match:
                              test_name = clean_test_name(match.group(1))
                              ms = parse_time_to_ms(match.group(2))
                              if ms is not None:
                                  samples.setdefault(test_name, []).append(ms)
              except Exception as e:
                  print(f'Error reading {filepath}: {e}')

              results = {}
              for test_name, values in samples.items():
                  values.sort()
                  n = len(values)
                  median = (values[n // 2] if n % 2 == 1
                            else (values[n // 2 - 1] + values[n // 2]) / 2.0)
                  results[test_name] = f'{median}ms'
                  if n > 1:
                      print(f'{test_name}: median={median:.0f}ms of {n} runs '
                            f'(min={values[0]:.0f}ms max={values[-1]:.0f}ms)')
              return results

          def parse_time_to_ms(time_str):
              if not time_str or time_str == 'N/A':
                  return None
              time_str = time_str.strip()
              match = re.match(r'^([\d.]+)\s*(\w+)$', time_str)
              if not match:
                  return None
              val = float(match.group(1))
              unit = match.group(2).lower()
              if unit == 'ms':
                  return val
              elif unit == 's':
                  return val * 1000
              elif unit == 'us':
                  return val / 1000
              elif unit == 'ns':
                  return val / 1000000
              return val

          def get_percentage_str(val_ms, ref_ms):
              if val_ms is None or ref_ms is None or ref_ms == 0:
                  return ' (N/A)'
              pct = round(((val_ms - ref_ms) / ref_ms) * 100)
              if pct > 0:
                  return f' (+{pct}%)'
              elif pct < 0:
                  return f' ({pct}%)'
              else:
                  return ' (0%)'

          existing_data = parse_gtest_output('./benchmark_results/current_core.txt')
          current_bq_data = parse_gtest_output('./benchmark_results/current_bq.txt')
          main_bq_data = parse_gtest_output('./benchmark_results/main_bq.txt')

          all_tests = set(existing_data.keys()).union(set(current_bq_data.keys())).union(set(main_bq_data.keys()))
          sorted_tests = sorted(list(all_tests))

          rows = []
          for test in sorted_tests:
              existing_raw = existing_data.get(test, 'N/A')
              cur_bq_raw = current_bq_data.get(test, 'N/A')
              main_bq_raw = main_bq_data.get(test, 'N/A')

              existing_ms = parse_time_to_ms(existing_raw)
              cur_bq_ms = parse_time_to_ms(cur_bq_raw)
              main_bq_ms = parse_time_to_ms(main_bq_raw)

              cur_bq_pct = get_percentage_str(cur_bq_ms, existing_ms) if cur_bq_raw != 'N/A' else ''
              main_bq_pct = get_percentage_str(main_bq_ms, cur_bq_ms) if main_bq_raw != 'N/A' else ''

              cur_bq_val = f'{cur_bq_raw}{cur_bq_pct}'
              main_bq_val = f'{main_bq_raw}{main_bq_pct}'

              rows.append((test, existing_raw, cur_bq_val, main_bq_val))

          # Define headers
          h1 = 'Test Case'
          h2 = 'Existing Driver (Current)'
          h3 = f'Google Driver ({branch_name})'
          h4 = 'Google Driver (Main)'

          # Calculate dynamic widths for formatting
          w1 = max([len(h1)] + [len(r[0]) for r in rows]) if rows else len(h1)
          w2 = max([len(h2)] + [len(r[1]) for r in rows]) if rows else len(h2)
          w3 = max([len(h3)] + [len(r[2]) for r in rows]) if rows else len(h3)
          w4 = max([len(h4)] + [len(r[3]) for r in rows]) if rows else len(h4)

          # Construct the Markdown table
          table = f"*Percentages in **{h3}** show change relative to **{h2}**. Percentages in **{h4}** show change relative to **{h3}**. Negative values indicate improvement (faster test execution), positive values indicate degradation (slower).*\n\n"
          table += f'| {h1.ljust(w1)} | {h2.ljust(w2)} | {h3.ljust(w3)} | {h4.ljust(w4)} |\n'
          table += '|-' + ('-' * w1) + '-|-' + ('-' * w2) + '-|-' + ('-' * w3) + '-|-' + ('-' * w4) + '-|\n'

          for r in rows:
              table += f'| {r[0].ljust(w1)} | {r[1].ljust(w2)} | {r[2].ljust(w3)} | {r[3].ljust(w4)} |\n'

          # Write table to file
          with open('benchmark_summary_table.txt', 'w') as f:
              f.write(table)
          EOF

      - name: Upload Table to GCS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          gcloud storage cp benchmark_summary_table.txt gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/
          echo "Uploaded benchmark table to gs://bq-dev-tools-testing-drivers/odbc-perf/$BRANCH_NAME/results/benchmark_summary_table.txt"
