name: macOS-CMake-Builds

on:
  workflow_call:
    inputs:
      checkout-ref:
        required: true
        description: "The ref we want to compile"
        type: string
    secrets:
      BUILD_CACHE_KEY:
        required: true

permissions:
  contents: read

jobs:
  cmake:
    name: cmake + ${{ matrix.os }} + ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: 'read'
      id-token: 'none'
    strategy:
      # Continue other builds even if one fails
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15 ]
        shard: [ BqDriver ]
    steps:
    - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      with:
        ref: ${{ inputs.checkout-ref }}
        persist-credentials: false
    - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        create_credentials_file: true
        credentials_json: ${{ secrets.BUILD_CACHE_KEY }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      id: py311
      with:
        python-version: '3.11'
    - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      with:
        version: '500.0.0'
      env:
        CLOUDSDK_PYTHON: ${{ steps.py311.outputs.python-path }}
    - name: Dynamic Configuration
      id: dynamic
      shell: bash
      run: |
        echo "vcpkg-version=$(cat ci/etc/vcpkg-version.txt)" >> "${GITHUB_OUTPUT}"
    - name: Install bash >= 5.x and Ninja
      run: brew install bash ninja
    - name: Download cmake formula(3.29.0) and installl
      run: |
        brew unlink cmake
        curl -L https://github.com/Kitware/CMake/releases/download/v3.29.0/cmake-3.29.0-macos-universal.tar.gz -o cmake.tar.gz
        tar -xzf cmake.tar.gz
        sudo cp -r cmake-3.29.0-macos-universal/CMake.app/Contents/bin/* /usr/local/bin/
        sudo cp -r cmake-3.29.0-macos-universal/CMake.app/Contents/share/cmake-3.29 /usr/local/share/
        cmake --version
    - name: cmake version
      run: cmake --version

    - name: Install bison flex for 'arrow'
      run: brew install bison flex
    - name: Download and Install vcpkg
      working-directory: "${{runner.temp}}"
      env:
        VCPKG_VERSION: ${{ steps.dynamic.outputs.vcpkg-version }}
      run: |
        git clone --branch "$VCPKG_VERSION" https://github.com/microsoft/vcpkg.git
        vcpkg/bootstrap-vcpkg.sh -disableMetrics
    - name: Install iODBC
      run: |
        brew install libiodbc

    - name: Setup the driver
      env:
        CLOUDSDK_PYTHON: ${{ steps.py311.outputs.python-path }}
      run: |
        export VCPKG_ROOT="${{ runner.temp }}/vcpkg"
        export PATH="$VCPKG_ROOT:/opt/homebrew/bin:$PATH"
        export LDFLAGS="-L$(brew --prefix libiodbc)/lib -liconv"
        export PATH="$(dirname "$CLOUDSDK_PYTHON"):$PATH"
        bash ci/dependencies/driver-manager-setup-osx.sh

    - name: Build cpp-bigquery-odbc
      env:
        CLOUDSDK_PYTHON: ${{ steps.py311.outputs.python-path }}
      run: |
        export ODBC_PREFIX="$(brew --prefix libiodbc)"
        export ODBC_INCLUDE_PATH="$ODBC_PREFIX/include"
        export VCPKG_ROOT="${{ runner.temp }}/vcpkg"

        export PATH="$(dirname "$CLOUDSDK_PYTHON"):$(brew --prefix)/bin:/opt/homebrew/bin:$VCPKG_ROOT:$PATH"
        export LDFLAGS="-L$(brew --prefix libiodbc)/lib -liconv"
        bash ci/gha/builds/macos-cmake.sh
    env:
      USE_BAZEL_VERSION: 7.0.0
      MATRIX_OS: ${{ matrix.os }}
      BAZEL_REMOTE_CACHE: https://storage.googleapis.com/gha-cache-cpp-bigquery-odbc/bazel-cache/${{ matrix.os }}
