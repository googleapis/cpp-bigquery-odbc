name: Linux Release Build

on:
  push:
    tags:
      - "v*.*.*" # Trigger only on version tags

permissions:
  contents: write

jobs:
  release:
    name: Release cpp-bigquery-odbc (Linux)
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      id: py311
      with:
        python-version: '3.11'

    - uses: google-github-actions/auth@v2
      with:
        create_credentials_file: true
        credentials_json: ${{ secrets.BUILD_CACHE_KEY }}

    - uses: google-github-actions/setup-gcloud@v2
      with:
        version: '500.0.0'
      env:
        CLOUDSDK_PYTHON: ${{ steps.py311.outputs.python-path }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build cmake build-essential \
          libiodbc2 libiodbc2-dev flex bison

    - name: Dynamic Configuration
      id: dynamic
      shell: bash
      run: |
        echo "vcpkg-version=$(cat ci/etc/vcpkg-version.txt)" >> "${GITHUB_OUTPUT}"

    - name: Download and Install vcpkg
      working-directory: "${{ runner.temp }}"
      run: |
        git clone --branch ${{ steps.dynamic.outputs.vcpkg-version }} https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Download and Install sccache
      run: |
        mkdir -p /var/tmp/sccache
        cd /var/tmp/sccache
        curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.5.4/sccache-v0.5.4-x86_64-unknown-linux-musl.tar.gz | \
          tar -zxf - --strip-components=1
        mkdir -p /usr/local/bin
        mv sccache /usr/local/bin/sccache
        chmod +x /usr/local/bin/sccache

    - name: Setup and Build cpp-bigquery-odbc driver
      run: |
        export VCPKG_ROOT="${{ runner.temp }}/vcpkg"
        export PATH="$VCPKG_ROOT:$PATH"
        bash ci/dependencies/driver-manage-release-setup-linux-macos.sh

    - name: Validate version.h DRIVER_VERSION matches tag
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        VERSION=${TAG#v}
        echo "Building version $VERSION"

        HEADER_VERSION=$(grep 'DRIVER_VERSION' google/cloud/odbc/internal/version.h | sed -E 's/.*"([^"]+)".*/\1/')
        echo "Tag version: $VERSION"
        echo "Header DRIVER_VERSION: $HEADER_VERSION"

        if [ "$VERSION" != "$HEADER_VERSION" ]; then
         echo "Mismatch: tag=$VERSION vs DRIVER_VERSION=$HEADER_VERSION"
         exit 1
        else
          echo "DRIVER_VERSION matches tag version"
        fi
    - name: Extract Version
      id: version
      run: |
       VERSION=${GITHUB_REF_NAME#v}
       echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create TAR Package
      run: |
        set -euo pipefail

        # Detect CMake build output directory
        if [ -d "cmake-out" ]; then
          BUILD_DIR="cmake-out"
        else
          echo "No build directory found. Did CMake run?"
          exit 1
        fi

        echo "Using build directory: $BUILD_DIR"

        # Prepare package folder
        mkdir -p release_package/lib

        # Copy driver files
        cp -v "$BUILD_DIR/google/cloud/odbc/libgoogle_cloud_odbc_bq_driver.so." "release_package/lib/libgoogle_cloud_odbc_bq_driver.so"

        # Copy ODBC config files
        cp -rv ci/gha/builds/release/odbc.ini release_package/odbc.ini
        cp -rv ci/gha/builds/release/odbcinst.ini release_package/odbcinst.ini

        # Create TAR.GZ file
        TAR_NAME="GoogleODBCDriverforGoogleBigQuery-linux-${{ steps.version.outputs.version }}.tar.gz"
        tar -czvf "$TAR_NAME" -C release_package .

        echo "TAR package created: $TAR_NAME"

    - name: Upload TAR to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: GoogleODBCDriverforGoogleBigQuery-linux-${{ steps.version.outputs.version }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
